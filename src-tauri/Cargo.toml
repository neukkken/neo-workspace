[package]
name = "neowork"
version = "1.10.0"
description = "NeoWork"
edition = "2021"

[lib]
name = "neowork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
