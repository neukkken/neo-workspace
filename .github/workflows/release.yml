name: Build and Release Installers

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            build_cmd: npm run dist:linux
            artifact_name: linux-packages
            artifact_path: dist/*.AppImage\ndist/*.deb
          - os: windows-latest
            build_cmd: npm run dist:win
            artifact_name: windows-packages
            artifact_path: dist/*.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux Build Essentials
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libarchive-tools

      - name: Install Dependencies
        run: npm ci

      - name: Check TypeScript Types
        run: npm run typecheck

      - name: Build and Package Executables
        run: ${{ matrix.build_cmd }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/windows-packages/*.exe
            dist-release/windows-packages/*.yml
            dist-release/windows-packages/*.blockmap
            dist-release/linux-packages/*.AppImage
            dist-release/linux-packages/*.deb
            dist-release/linux-packages/*.yml
            dist-release/linux-packages/*.blockmap
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
