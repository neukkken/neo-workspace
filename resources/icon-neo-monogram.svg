<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="nEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGrad3)" stroke="#1a202c" stroke-width="8" />

  <!-- Monogram N composed of Chevron '>' and Terminal Cursor Pillar -->
  <!-- Left Chevron / Diagonal -->
  <path d="M 124 380 L 124 132 L 270 290 L 270 132" 
        fill="none" 
        stroke="url(#nEmeraldGrad)" 
        stroke-width="38" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow3)" />

  <!-- Right Terminal Prompt Line completing modern N aesthetic -->
  <path d="M 388 132 L 388 380" 
        fill="none" 
        stroke="url(#nEmeraldGrad)" 
        stroke-width="38" 
        stroke-linecap="round" 
        filter="url(#glow3)" />

  <!-- Prompt Accent Dot -->
  <circle cx="388" cy="132" r="19" fill="#6ee7b7" />
</svg>
