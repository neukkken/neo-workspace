<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#08090c" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGrad)" stroke="#1f242e" stroke-width="8" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="none" stroke="#272f3d" stroke-width="2" opacity="0.6" />

  <!-- Terminal Window Title Dots (Minimalist) -->
  <circle cx="96" cy="96" r="10" fill="#27272a" />
  <circle cx="130" cy="96" r="10" fill="#27272a" />
  <circle cx="164" cy="96" r="10" fill="#27272a" />

  <!-- Terminal Prompt Symbol '>_' with Clean Geometry -->
  <!-- Chevron '>' -->
  <path d="M 120 180 L 230 270 L 120 360" 
        fill="none" 
        stroke="url(#emeraldGrad)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#emeraldGlow)" />

  <!-- Underline Cursor '_' -->
  <line x1="260" y1="360" x2="385" y2="360" 
        stroke="url(#emeraldGrad)" 
        stroke-width="36" 
        stroke-linecap="round" 
        filter="url(#emeraldGlow)" />
</svg>
