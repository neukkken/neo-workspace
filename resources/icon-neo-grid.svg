<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1015" />
      <stop offset="100%" stop-color="#060709" />
    </linearGradient>
    <linearGradient id="activeNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGrad2)" stroke="#1a1f29" stroke-width="8" />

  <!-- 2x2 Orchestrator Grid -->
  <!-- Panel 1 (Top Left - Primary Active Terminal) -->
  <rect x="100" y="100" width="136" height="136" rx="24" fill="url(#activeNodeGrad)" opacity="0.95" />
  <!-- Small Prompt icon inside active panel -->
  <path d="M 136 150 L 160 168 L 136 186" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="172" y1="186" x2="196" y2="186" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />

  <!-- Panel 2 (Top Right - Secondary Terminal) -->
  <rect x="276" y="100" width="136" height="136" rx="24" fill="#131720" stroke="#1f2937" stroke-width="4" />
  <circle cx="344" cy="168" r="14" fill="#10b981" opacity="0.7" />

  <!-- Panel 3 (Bottom Left - Background Service Terminal) -->
  <rect x="100" y="276" width="136" height="136" rx="24" fill="#131720" stroke="#1f2937" stroke-width="4" />
  <line x1="130" y1="344" x2="206" y2="344" stroke="#374151" stroke-width="8" stroke-linecap="round" />

  <!-- Panel 4 (Bottom Right - Metrics/Output Panel) -->
  <rect x="276" y="276" width="136" height="136" rx="24" fill="#131720" stroke="#1f2937" stroke-width="4" />
  <!-- Telemetry mini pulse -->
  <path d="M 300 344 L 324 344 L 334 324 L 348 360 L 360 344 L 388 344" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
</svg>
